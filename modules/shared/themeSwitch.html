<!-- ===== LIGHT / DARK SWITCH (used on the title screen; the top bar has its own copy) =====
     The sliding block sits on the sun in light mode and on the moon in dark mode (shared.css, part 8).
     shared.js switches the mode when it is clicked. -->
<button type="button" class="theme-switch" role="switch" aria-checked="false" aria-label="Dark mode">
    <span class="switch-knob" aria-hidden="true"></span>
    <span class="switch-icon switch-sun" aria-hidden="true"><i class="fa-solid fa-sun"></i></span>
    <span class="switch-icon switch-moon" aria-hidden="true"><i class="fa-solid fa-moon"></i></span>
</button>
